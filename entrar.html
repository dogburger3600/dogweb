<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrar - Dog Burger</title>
  <link rel="icon" type="image/png" href="dogburger.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="signup-page">
  <header class="c-header signup-header">
    <a href="index.html" class="c-header-logo signup-brand" aria-label="Voltar ao cardápio">
      <div>
        <span class="c-header-name">Dog Burger</span>
        <span class="c-header-sub">Acesso à conta</span>
      </div>
    </a>
    <a href="index.html" class="btn-ghost">← Voltar ao cardápio</a>
  </header>

  <main class="login-main">
    <section class="signup-card login-card">
      <img src="dogburger.png" alt="Dog Burger" class="auth-page-logo" />
      <h1>Que bom ter você de volta!</h1>
      <p class="signup-card-sub">Entre para acessar sua conta.</p>
      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="login-email">E-mail</label>
          <input class="form-input" id="login-email" type="email" autocomplete="email" placeholder="seu@email.com" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="login-password">Senha</label>
          <div class="password-field"><input class="form-input" id="login-password" type="password" autocomplete="current-password" placeholder="Digite sua senha" required /><button class="password-toggle" type="button" data-password-target="login-password" aria-label="Mostrar senha" aria-pressed="false"><svg class="eye-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.5"/><path class="eye-slash" d="M4 4 20 20"/></svg></button></div>
        </div>
        <div class="captcha-wrap login-captcha"><div id="login-captcha"></div></div>
        <p id="login-error" class="form-error login-error"></p>
        <button class="btn-primary signup-submit" id="login-submit" type="submit">Entrar</button>
      </form>
      <p class="login-signup">Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/entrar.js"></script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onLoginTurnstileLoad&render=explicit" async defer></script>
</body>
</html>
