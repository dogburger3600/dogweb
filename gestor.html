<!DOCTYPE html>

  <aside class="m-sidebar">
    <div class="m-sidebar-header">
      <div class="m-sidebar-logo">
        <img src="dogburger.png" alt="Dog Burger" class="m-sidebar-brand-logo" />
        <div>
          <span class="m-sidebar-name">Dog Burger</span>
          <span class="m-sidebar-role">Área do Gestor</span>
        </div>
      </div>
    </div>
    <nav class="m-nav">
      <button class="m-nav-btn active" id="nav-dashboard" type="button" title="Dashboard" data-capability="viewDashboard" aria-current="page" onclick="setView('dashboard')">
        <svg class="manager-icon" aria-hidden="true"><use href="#icon-dashboard"></use></svg><span class="m-nav-label">Dashboard</span>
      </button>
      <button class="m-nav-btn" id="nav-pedidos" type="button" title="Pedidos" data-capability="viewOrders" onclick="setView('pedidos')">
        <svg class="manager-icon" aria-hidden="true"><use href="#icon-orders"></use></svg><span class="m-nav-label">Pedidos</span>
        <span class="m-nav-badge hidden" id="active-orders-badge">0</span>
      </button>
      <button class="m-nav-btn" id="nav-relatorios" type="button" title="Relatórios" data-capability="viewReports" onclick="setView('relatorios')">
        <svg class="manager-icon" aria-hidden="true"><use href="#icon-reports"></use></svg><span class="m-nav-label">Relatórios</span>
      </button>
      <button class="m-nav-btn" id="nav-estoque-lanches" type="button" title="Estoque de Lanches" data-capability="manageStock" onclick="setView('estoque-lanches')">
        <svg class="manager-icon" aria-hidden="true"><use href="#icon-stock"></use></svg><span class="m-nav-label">Estoque de Lanches</span>
      </button>
      <a class="m-nav-btn m-nav-link" href="cardapio-gestor.html" title="Editar Cardápio" data-capability="manageMenu">
        <svg class="manager-icon" aria-hidden="true"><use href="#icon-menu"></use></svg><span class="m-nav-label">Editar Cardápio</span>
      </a>
      <button class="m-nav-btn" id="nav-popup" type="button" title="Pop-up Inicial" data-capability="managePopup" onclick="setView('popup')">
        <svg class="manager-icon" aria-hidden="true"><use href="#icon-megaphone"></use></svg><span class="m-nav-label">Pop-up Inicial</span>
      </button>
      <button class="m-nav-btn" id="nav-configuracoes" type="button" title="Configurações da Loja" data-capability="manageSettings" onclick="setView('configuracoes')">
        <svg class="manager-icon" aria-hidden="true"><use href="#icon-settings"></use></svg><span class="m-nav-label">Configurações da Loja</span>
      </button>
    </nav>
    <div class="m-sidebar-footer">
      <a href="index.html" title="Ver Cardápio"><svg class="manager-icon" aria-hidden="true"><use href="#icon-store"></use></svg><span class="m-sidebar-footer-label">Ver Cardápio</span></a>
      <button type="button" title="Sair da conta" onclick="signOutManager()"><svg class="manager-icon" aria-hidden="true"><use href="#icon-logout"></use></svg><span class="m-sidebar-footer-label">Sair da conta</span></button>
    </div>
  </aside>

  <div class="m-main">
    <header class="m-topbar">
      <div class="m-topbar-heading"><h1 class="m-topbar-title" id="view-title">Dashboard</h1><p id="view-description">Visão geral da operação em tempo real</p></div>
      <div class="topbar-actions">
        <a href="cardapio-gestor.html" class="topbar-menu-link" data-capability="manageMenu"><svg class="manager-icon" aria-hidden="true"><use href="#icon-menu"></use></svg><span>Editar Cardápio</span></a>
        <div class="m-online" role="status" aria-label="Sistema online">
          <div class="m-online-dot"></div>
          <span class="m-online-label">Online</span>
        </div>
        <div class="m-mobile-actions">
          <a href="index.html" aria-label="Ver cardápio"><svg class="manager-icon" aria-hidden="true"><use href="#icon-store"></use></svg></a>
          <button type="button" aria-label="Sair da conta" onclick="signOutManager()"><svg class="manager-icon" aria-hidden="true"><use href="#icon-logout"></use></svg></button>
        </div>
      </div>
    </header>
    <main class="m-content" id="m-content"></main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
