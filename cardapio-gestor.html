<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Editar Cardápio - Dog Burger</title>
  <link rel="icon" type="image/png" href="dogburger.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Nunito:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="menu-manager-loading" id="menu-manager-loading">Verificando acesso...</div>

  <div id="page-menu-manager" class="hidden">
    <aside class="m-sidebar">
      <div class="m-sidebar-header">
        <div class="m-sidebar-logo">
          <img src="dogburger.png" alt="Dog Burger" class="m-sidebar-brand-logo" />
          <div><span class="m-sidebar-name">Dog Burger</span><span class="m-sidebar-role">Área do Gestor</span></div>
        </div>
      </div>
      <nav class="m-nav">
        <a class="m-nav-btn m-nav-link" href="gestor.html?view=dashboard" title="Dashboard"><span aria-hidden="true">📊</span><span class="m-nav-label">Dashboard</span></a>
        <a class="m-nav-btn m-nav-link" href="gestor.html?view=pedidos" title="Pedidos"><span aria-hidden="true">📋</span><span class="m-nav-label">Pedidos</span></a>
        <a class="m-nav-btn m-nav-link" href="gestor.html?view=relatorios" title="Relatórios"><span aria-hidden="true">📈</span><span class="m-nav-label">Relatórios</span></a>
        <a class="m-nav-btn m-nav-link active" href="cardapio-gestor.html" title="Editar Cardápio"><span aria-hidden="true">🍔</span><span class="m-nav-label">Editar Cardápio</span></a>
        <a class="m-nav-btn m-nav-link" href="gestor.html?view=popup" title="Pop-up Inicial"><span aria-hidden="true">📣</span><span class="m-nav-label">Pop-up Inicial</span></a>
      </nav>
      <div class="m-sidebar-footer">
        <a href="index.html" title="Ver Cardápio"><span aria-hidden="true">←</span><span class="m-sidebar-footer-label">Ver Cardápio</span></a>
        <button id="menu-manager-logout" type="button" title="Sair da conta"><span aria-hidden="true">↪</span><span class="m-sidebar-footer-label">Sair da conta</span></button>
      </div>
    </aside>

    <div class="m-main">
      <header class="m-topbar">
        <div><h1 class="m-topbar-title">Editor de Cardápio</h1><p class="menu-topbar-sub">Crie e organize seus produtos</p></div>
        <button class="btn-new-expense menu-add-button" id="new-product-button">+ Novo produto</button>
      </header>
      <main class="m-content">
        <div class="menu-toolbar">
          <div class="menu-search-wrap"><span>🔍</span><input id="menu-search" type="search" placeholder="Buscar produto" /></div>
          <select class="form-select menu-filter" id="menu-category-filter">
            <option value="todos">Todas as categorias</option>
            <option value="lanches">Lanches</option><option value="combos">Combos</option><option value="sucos">Sucos</option>
            <option value="refrigerantes">Refrigerantes</option><option value="sobremesas">Sobremesas</option>
          </select>
          <label class="menu-archived-toggle"><input type="checkbox" id="show-archived" /> Mostrar desativados</label>
        </div>
        <div class="menu-manager-grid" id="menu-manager-grid"></div>
      </main>
    </div>
  </div>

  <div id="product-overlay" class="modal-overlay hidden"></div>
  <div id="product-modal" class="modal product-modal hidden">
    <div class="product-modal-head"><div><h2 class="modal-title" id="product-modal-title">Novo produto</h2><p class="modal-sub">Os dados serão salvos no Supabase.</p></div><button class="btn-close" id="close-product-modal" type="button">✕</button></div>
    <form id="product-form">
      <input type="hidden" id="product-id" />
      <div class="form-group"><label class="form-label" for="product-name">Nome *</label><input class="form-input" id="product-name" maxlength="80" required /></div>
      <div class="form-group"><label class="form-label" for="product-description">Descrição *</label><textarea class="form-textarea" id="product-description" rows="3" maxlength="240" required></textarea></div>
      <div class="signup-grid">
        <div class="form-group"><label class="form-label" for="product-category">Categoria *</label><select class="form-select" id="product-category" required><option value="lanches">Lanches</option><option value="combos">Combos</option><option value="sucos">Sucos</option><option value="refrigerantes">Refrigerantes</option><option value="sobremesas">Sobremesas</option></select></div>
        <div class="form-group"><label class="form-label" for="product-price">Preço (R$) *</label><input class="form-input" id="product-price" type="number" min="0" step="0.01" required /></div>
      </div>
        <div class="product-upload-group">
          <label class="form-label">Foto do produto *</label>
          <input class="hidden" id="product-image" type="file" accept="image/jpeg,image/png,image/webp,image/gif" />
          <input id="product-current-image" type="hidden" />
          <div class="product-upload-box" id="product-upload-box">
            <img class="hidden" id="product-image-preview" alt="Prévia do produto" />
            <div id="product-upload-prompt"><span>📷</span><strong>Importar foto</strong><small>JPG, PNG, WEBP ou GIF · até 5 MB</small></div>
            <button class="btn-upload-image" id="choose-product-image" type="button">Escolher imagem</button>
          </div>
        </div>
      <p class="form-error" id="product-form-error"></p>
      <div class="modal-actions"><button class="btn-secondary" id="cancel-product" type="button">Cancelar</button><button class="btn-primary" id="save-product" type="submit">Salvar produto</button></div>
    </form>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/cardapio-gestor.js"></script>
</body>
</html>
